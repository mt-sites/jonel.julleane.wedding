*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#222;font-family:var(--body);font-weight:300;line-height:1.65;color:var(--ink)}
#app{width:100%;max-width:none;margin:0 auto;background:var(--paper);min-height:100svh;position:relative;overflow:hidden}
h1,h2{font-family:var(--display);font-weight:400;margin:0}
.pattern{background-image:linear-gradient(45deg,rgba(255,255,255,.14) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.14) 75%),linear-gradient(45deg,rgba(255,255,255,.14) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.14) 75%);background-size:28px 28px;background-position:0 0,14px 14px}
.lace{position:absolute;left:0;right:0;height:26px;background:radial-gradient(circle at 13px 0,transparent 11px,var(--light) 12px) 0 0/26px 26px repeat-x;opacity:.9}
.lace.top{top:0}.lace.bot{bottom:0;transform:scaleY(-1)}

/* COVER (doors) */
#cover{position:fixed;inset:0;z-index:50;display:flex;cursor:pointer;perspective:1800px;perspective-origin:50% 50%}
#cover .door{flex:1;background-color:var(--cover);background-image:radial-gradient(ellipse at 50% 30%,var(--cover2),var(--cover) 70%);background-size:200% 100%;background-repeat:no-repeat;transition:transform 1.8s cubic-bezier(.65,0,.25,1) .3s,filter 1.4s ease .3s;position:relative;overflow:hidden;will-change:transform}
#cover .door.l{background-position:0 0}#cover .door.r{background-position:100% 0}
#cover .l{border-right:1px solid rgba(0,0,0,.25)}
#cover .door.l{transform-origin:0 50%}#cover .door.r{transform-origin:100% 50%}
#cover.open .l{transform:rotateY(84deg);filter:brightness(.45)}#cover.open .r{transform:rotateY(-84deg);filter:brightness(.45)}
#cover.open{pointer-events:none;transition:opacity .8s ease 2s;opacity:0}

/* OPENING EFFECTS: golden light, rays, rings and a burst of fairy dust */
#cover .glow{position:absolute;inset:0;opacity:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(255,243,208,.98) 0,rgba(243,209,128,.75) 20%,rgba(216,180,94,.3) 44%,transparent 72%)}
#cover.open .glow{animation:glowIn 2.1s ease .1s forwards}
@keyframes glowIn{0%{opacity:0}22%{opacity:1}100%{opacity:.25}}
#cover .rays{position:absolute;left:50%;top:50%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:repeating-conic-gradient(from 0deg,rgba(255,232,168,.5) 0 3deg,transparent 3deg 11deg);
  -webkit-mask-image:radial-gradient(circle,#000 0,transparent 46%);mask-image:radial-gradient(circle,#000 0,transparent 46%)}
#cover.open .rays{animation:raysGo 2.1s ease-out forwards}
@keyframes raysGo{0%{opacity:0;transform:rotate(0) scale(.5)}25%{opacity:.95}100%{opacity:0;transform:rotate(38deg) scale(1.15)}}
#cover .beam{position:absolute;top:0;bottom:0;left:50%;width:2px;transform:translateX(-50%);pointer-events:none;opacity:.45;
  background:linear-gradient(transparent,#ffeab0 18%,#ffeab0 82%,transparent);box-shadow:0 0 22px 6px rgba(255,226,150,.55);animation:beamIdle 2.6s ease-in-out infinite}
@keyframes beamIdle{50%{opacity:.8;box-shadow:0 0 30px 10px rgba(255,226,150,.75)}}
#cover.open .beam{animation:beamOpen 1.6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes beamOpen{0%{opacity:1;width:2px}35%{opacity:1;width:34vw;box-shadow:0 0 90px 40px rgba(255,226,150,.85)}100%{opacity:0;width:90vw;box-shadow:0 0 140px 80px rgba(255,226,150,.3)}}
#cover .ring{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:2px solid rgba(255,226,150,.9);box-shadow:0 0 24px rgba(255,226,150,.7),inset 0 0 24px rgba(255,226,150,.5);opacity:0;pointer-events:none}
#cover.open .ring{animation:ringGo 1.5s cubic-bezier(.2,.6,.3,1) forwards}
#cover.open .ring.r2{animation-delay:.28s}
@keyframes ringGo{0%{opacity:.95;transform:scale(.4)}100%{opacity:0;transform:scale(7)}}
#cover .dust{position:absolute;left:50%;top:50%;width:var(--sz);height:var(--sz);margin:calc(var(--sz)/-2) 0 0 calc(var(--sz)/-2);border-radius:50%;background:var(--c);box-shadow:0 0 10px 2px var(--c);opacity:0;pointer-events:none;animation:burst var(--t) cubic-bezier(.15,.7,.25,1) var(--d) forwards}
#cover .dust.st{border-radius:0;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);box-shadow:none;filter:drop-shadow(0 0 5px var(--c))}
@keyframes burst{0%{opacity:0;transform:translate(0,0) scale(.2)}12%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.5) rotate(180deg)}}
#seal{position:absolute;left:50%;top:50%;width:210px;transform:translate(-50%,-50%);z-index:2;text-align:center;color:var(--light);transition:opacity .4s}
#cover.open #seal p{opacity:0;transition:opacity .3s}
#seal svg{width:210px;height:auto;filter:drop-shadow(0 0 16px rgba(216,180,94,.55)) drop-shadow(0 4px 8px rgba(0,0,0,.4))}
/* Monogram: two interlocking J's with rings and a diamond (drawn as vector art) */
.mring,.marc{animation:ringDraw 2.2s cubic-bezier(.4,0,.2,1) both}
.mring.rB{animation-delay:.7s}.marc{animation-delay:1.4s;animation-duration:1.6s}
@keyframes ringDraw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.mletters,.mdia{animation:mjIn 1.6s ease .5s both}
.mdia{animation-delay:1.3s}
@keyframes mjIn{from{opacity:0;filter:blur(5px)}to{opacity:1;filter:none}}
.mshine{animation:shineSweep 5s ease-in-out 3s infinite;transform-origin:0 0}
@keyframes shineSweep{0%{transform:translateX(0) skewX(-18deg)}40%,100%{transform:translateX(1100px) skewX(-18deg)}}
.mstar{transform-box:fill-box;transform-origin:center;animation:twink 2.6s ease-in-out infinite}
.mstar.s2{animation-delay:.6s}.mstar.s3{animation-delay:1.2s}.mstar.s4{animation-delay:1.8s}
.mstar.glint{animation:glint 3.2s ease-in-out 1.6s infinite;opacity:0}
@keyframes twink{0%,100%{opacity:.25;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.25) rotate(45deg)}}
@keyframes glint{0%,100%{opacity:0;transform:scale(.2) rotate(0)}40%{opacity:1;transform:scale(1) rotate(45deg)}70%{opacity:0;transform:scale(.3) rotate(90deg)}}
#cover.open #seal svg{animation:sealOpen 1.1s cubic-bezier(.3,.6,.3,1) forwards}
@keyframes sealOpen{0%{transform:scale(1);opacity:1;filter:drop-shadow(0 0 16px rgba(216,180,94,.6))}
  30%{transform:scale(1.22);opacity:1;filter:brightness(1.55) drop-shadow(0 0 40px rgba(255,226,150,1))}
  100%{transform:scale(2.5);opacity:0;filter:brightness(2) drop-shadow(0 0 60px rgba(255,226,150,1))}}
#seal p{margin:10px 0 0;font-size:.85rem;letter-spacing:.08em}

/* HERO */
.hero{min-height:100svh;background:radial-gradient(ellipse at 50% 30%,var(--cover2),var(--cover) 70%);color:var(--light);text-align:center;padding:90px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.hero .arch{position:absolute;inset:26px 26px auto;height:62%;border:2px solid rgba(255,247,239,.5);border-radius:200px 200px 0 0}
.scene{position:relative;width:min(88vw,330px);aspect-ratio:330/220;margin-bottom:6px;perspective:900px;perspective-origin:50% 40%}
.sway,.stage{position:absolute;inset:0;transform-style:preserve-3d}
.sway{animation:swayY 9s ease-in-out infinite}
@keyframes swayY{0%,100%{transform:rotateY(-6deg) rotateX(2deg)}50%{transform:rotateY(6deg) rotateX(-1deg)}}
.stage{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.ly{position:absolute;inset:0;pointer-events:none;transform-style:preserve-3d}
.ly.sky{transform:translateZ(-140px) scale(1.18)}
.rays{position:absolute;left:50%;top:52%;width:150%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);
  background:repeating-conic-gradient(from 0deg,rgba(255,236,190,.2) 0 4deg,transparent 4deg 15deg);
  -webkit-mask-image:radial-gradient(circle,#000 0,transparent 62%);mask-image:radial-gradient(circle,#000 0,transparent 62%);animation:raySpin 48s linear infinite}
@keyframes raySpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.halo{position:absolute;left:50%;top:56%;width:86%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,244,214,.55),rgba(216,180,94,.2) 42%,transparent 70%);animation:haloPulse 5s ease-in-out infinite}
@keyframes haloPulse{50%{opacity:.6;transform:translate(-50%,-50%) scale(1.08)}}
.tws{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff3c8;box-shadow:0 0 8px 2px rgba(255,236,170,.8);animation:tw 3s infinite}
.cloud{overflow:visible}
.cloud i{position:absolute;display:block;border-radius:50px;background:rgba(255,255,255,.2);filter:blur(1.5px)}
.cloud i::before,.cloud i::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud.c1{transform:translateZ(-80px) scale(1.1)}
.cloud.c1 i{left:-30%;top:22%;width:34%;height:9%;animation:cloudA 38s linear infinite}
.cloud.c1 i::before{width:42%;height:150%;left:14%;top:-70%}.cloud.c1 i::after{width:34%;height:120%;left:50%;top:-50%}
.cloud.c2{transform:translateZ(-40px) scale(1.05)}
.cloud.c2 i{left:-30%;top:42%;width:26%;height:7%;opacity:.8;animation:cloudA 27s linear -12s infinite}
.cloud.c2 i::before{width:44%;height:150%;left:12%;top:-70%}.cloud.c2 i::after{width:34%;height:120%;left:52%;top:-50%}
@keyframes cloudA{to{transform:translateX(420%)}}
.ly.church{display:flex;align-items:flex-end;justify-content:center;transform:translateZ(0)}
.churchsvg{display:block;width:84%;height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35)) drop-shadow(0 0 22px rgba(255,236,190,.25))}
.churchsvg .win{animation:winGlow 4s ease-in-out infinite}
@keyframes winGlow{0%,100%{opacity:1}50%{opacity:.72}}
.churchsvg .bell{transform-box:fill-box;transform-origin:50% 0;animation:bellSwing 2.4s ease-in-out infinite}
@keyframes bellSwing{0%,100%{transform:rotate(-13deg)}50%{transform:rotate(13deg)}}
.churchsvg .cglint{transform-box:fill-box;transform-origin:center;animation:glint 3.4s ease-in-out 1s infinite;opacity:0}
.ly.flyer{transform:translateZ(0)}
.dove{position:absolute;left:50%;top:38%;width:24%;margin-left:-12%;will-change:transform;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35)) drop-shadow(0 0 14px rgba(255,255,255,.45))}
.dovesvg{display:block;width:100%;height:auto;overflow:visible}
.dovesvg .wing{transform-box:view-box;transform-origin:66px 46px;animation:flap .62s ease-in-out infinite}
.dovesvg .wing.far{animation-delay:-.07s}
@keyframes flap{0%,100%{transform:rotate(8deg) scaleY(1)}50%{transform:rotate(78deg) scaleY(.82)}}
.dovesvg .olive{transform-box:fill-box;transform-origin:0 50%;animation:oliveBob .62s ease-in-out infinite}
@keyframes oliveBob{50%{transform:rotate(6deg)}}
.ly.fx{transform:translateZ(60px)}

const CONFIG = {

   schedule: [

    ["12:00 NN", "Lunch and Pantomina", "St. Dominic of Guzman Parish, Legazpi Hall"]
  ],

  // ---- Gift, gallery, RSVP ----
  giftTitle: "Gifts",
  giftText: "Please do not feel obliged to give us a gift. Your presence on our wedding is enough. However, if you wish to give us something, monetary gift will be greatly appreciated.",
  giftNote: "",
  qrCodes: [                             // label = text under the code, image = file next to this page
    { label: "GCash", image: "gcash.jpg" },       // e.g. image: "gcash.png"
    { label: "Landbank",  image: "Landbank.jpg" }        // e.g. image: "maya.png"
  ],

  gallery: ["", "", "", ""],             // any number of photos, e.g. ["p1.jpg","p2.jpg","p3.jpg","p4.jpg","p5.jpg"]
  photo: "",                             // couple photo, e.g. "couple.jpg"
  rsvpTitle: "RSVP",

  // Google Form link: run rsvp-google-form.gs, then paste the 5 values it prints
  googleForm: {
    action: "https://docs.google.com/forms/d/e/1FAIpQLSe7sGyVx0Zg_UIl0PaEwzpuItEKvpFF008wRpQH0JliBJ0Q1Q/formResponse",                          // ends with /formResponse
    name: "entry.1116968952",                            // entry.xxxxxxxxx  (full name)
    attend: "entry.402081541",                          // entry.xxxxxxxxx  (accept / decline)
    guests: "entry.216696421",                          // entry.xxxxxxxxx  (number of guests)
    note: "entry.511326714"                             // entry.xxxxxxxxx  (optional note)
  },
  rsvpEndpoint: "",                      // optional: another web app URL (used only if googleForm.action is empty)
  rsvpEmail: "mattglennl83@gmail.com",         // used only if both of the above are empty
  closing: "With love, Jonel and Julleane",
  credits: "Made with:",    // small text at the very bottom (clear it to hide)
  creditsLinkText: "TAPLOOP",                  // the clickable part
  creditsUrl: "https://taploop.mt-sites.workers.dev/" ,                         // where the link goes

  theme: "midnight",
  themes: {
    //          doors/hero   hero glow    page border  paper       text        accent
    midnight:{ cover:"#0b1a3a", cover2:"#1d3568", frame:"#12275a", paper:"#ffffff", mist:"#eef1f7", ink:"#0b1a3a", gold:"#d8b45e" }
  }
};

/* ---------- Do not need to edit below this line ---------- */
const C = CONFIG, $ = s => document.querySelector(s);
const d = new Date(C.dateISO + "T00:00:00");
C.dateLong = d.toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"});

function applyTheme(n){
  const t = C.themes[n]; if(!t) return;
  for(const k in t) document.documentElement.style.setProperty("--"+k, t[k]);
  document.querySelectorAll(".pattern").forEach(e=>{ if(e.closest("#cover")) e.style.backgroundColor = t.cover; else e.style.backgroundColor = t.frame; });
}
document.querySelectorAll("[data-t]").forEach(e => e.textContent = C[e.dataset.t]);
document.title = C.name1 + " & " + C.name2 + " – Wedding Invitation";
$("#map").href = C.mapUrl;
{ const cr = $("#credits"); cr.textContent = C.credits || "";
  if(C.creditsLinkText && C.creditsUrl){ const a = document.createElement("a");
    a.href = C.creditsUrl; a.textContent = C.creditsLinkText; a.target = "_blank"; a.rel = "noopener";
    if(cr.textContent) cr.append(" "); cr.append(a); } }
$("#sw").innerHTML = C.dressColors.map(c => `<span style="background:${c}"></span>`).join("");
$("#plan").innerHTML = C.schedule.map(s => `<li><time>${s[0]}</time><span><b style="font-weight:500">${s[1]}</b><br><span style="opacity:.75">${s[2]||""}</span></span></li>`).join("");

// Calendar
const cal = $("#cal"); let h = ["S","M","T","W","T","F","S"].map(x=>`<b>${x}</b>`).join("");
const first = new Date(d.getFullYear(), d.getMonth(), 1).getDay(), days = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
h += "<span></span>".repeat(first);
for(let i=1;i<=days;i++) h += `<span class="${i===d.getDate()?"on":""}">${i}</span>`;
cal.innerHTML = h;

// Images (blank keeps the colored placeholder)
if(C.photo) $("#photo").style.backgroundImage = `linear-gradient(transparent 60%,rgba(0,0,0,.5)),url("${C.photo}")`, $(".hint").hidden = true;
$("#qrs").innerHTML = C.qrCodes.map(q => `<figure class="qrbox"><div class="qr${q.image?"":" ph"}"${q.image?` role="img" aria-label="${q.label} QR code" style="background-image:url('${q.image}')"`:""}>${q.image?"":"QR code"}</div><figcaption>${q.label}</figcaption></figure>`).join("");
const PH_AR = [0.75, 1, 1.33];   // placeholder shapes until real photos are set
$("#gallery").innerHTML = C.gallery.map((g,i)=> g
  ? `<figure class="shot"><img src="${g}" alt="Photo ${i+1}" decoding="async"></figure>`
  : `<figure class="shot ph" style="--ar:${PH_AR[i%3]}">Photo ${i+1}</figure>`).join("");
// Size each photo by its own shape so rows fill the card neatly
document.querySelectorAll("#gallery .shot img").forEach(img=>{
  const fit = () => { if(img.naturalWidth) img.parentNode.style.setProperty("--ar", (img.naturalWidth/img.naturalHeight).toFixed(4)); };
  img.complete ? fit() : img.addEventListener("load", fit);
});
if(C.qrCodes.every(q => q.image)) $("[data-t=giftNote]").textContent = "";

// Theme
applyTheme(C.theme);
// Petals
document.querySelectorAll(".petals").forEach(box=>{
  const inCover=!!box.closest("#cover"), total=innerWidth<500?10:innerWidth<1000?16:26;
  for(let i=0;i<(inCover?Math.ceil(total*0.7):total);i++){
    const p=document.createElement("span");
    p.className="petal"+(i%2?" w":"");
    p.style.left=(Math.random()*100)+"%";
    p.style.setProperty("--dx",(Math.random()*120-60)+"px");
    p.style.animationDuration=(9+Math.random()*8)+"s";
    p.style.animationDelay=(-Math.random()*14)+"s";
    p.style.transform="scale("+(0.7+Math.random()*0.8)+")";
    box.appendChild(p);
  }
});
// Scroll reveal
const io=("IntersectionObserver" in window)?new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.15}):null;
document.querySelectorAll(".reveal").forEach(e=>io?io.observe(e):e.classList.add("in"));

// Cover
// Every visit starts at the first page: no restored scroll position, no #rsvp jump
if("scrollRestoration" in history) history.scrollRestoration = "manual";
const toTop = () => window.scrollTo({top:0, left:0, behavior:"instant"});
const clearHash = () => { if(location.hash) history.replaceState(null, "", location.pathname + location.search); };
clearHash(); toTop();
addEventListener("load", () => { clearHash(); toTop(); });
addEventListener("pageshow", e => { if(e.persisted){ clearHash(); toTop(); } });

// Fairy-dust burst from the seal when the doors open
const burst = () => {
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols = ["#ffe9a8", "#f3d180", "#d8b45e", "#ffffff"], n = innerWidth < 500 ? 34 : 54, R = Math.max(innerWidth, innerHeight);
  for(let i = 0; i < n; i++){
    const d = document.createElement("span"), a = Math.random() * Math.PI * 2, r = R * (0.18 + Math.random() * 0.42), star = i % 3 === 0;
    d.className = "dust" + (star ? " st" : "");
    d.style.setProperty("--dx", Math.cos(a) * r + "px");
    d.style.setProperty("--dy", Math.sin(a) * r * 0.8 + "px");
    d.style.setProperty("--sz", (star ? 9 + Math.random() * 11 : 3 + Math.random() * 4) + "px");
    d.style.setProperty("--c", cols[i % cols.length]);
    d.style.setProperty("--t", (1.1 + Math.random() * 1.2) + "s");
    d.style.setProperty("--d", (Math.random() * 0.35) + "s");
    cover.appendChild(d);
  }
};
// Background music: starts on the tap that opens the doors
const bgm = C.music ? Object.assign(new Audio(C.music), {loop:true, preload:"auto", volume:0}) : null;
const musicBtn = $("#musicBtn"); let wantMusic = false, fadeT = 0;
const fadeTo = (v, ms, done) => {
  clearInterval(fadeT); const from = bgm.volume, t0 = performance.now();
  fadeT = setInterval(() => { const k = Math.min(1, (performance.now() - t0) / ms); bgm.volume = Math.max(0, Math.min(1, from + (v - from) * k)); if(k === 1){ clearInterval(fadeT); done && done(); } }, 50);
};
const setMusicUI = on => { musicBtn.classList.toggle("playing", on); musicBtn.classList.toggle("off", !on); musicBtn.setAttribute("aria-pressed", String(on)); musicBtn.setAttribute("aria-label", on ? "Turn music off" : "Turn music on"); };
const playMusic = () => { wantMusic = true; bgm.play().then(() => { setMusicUI(true); fadeTo(C.musicVolume ?? 0.6, 2500); }).catch(() => { wantMusic = false; setMusicUI(false); }); };
const pauseMusic = () => { wantMusic = false; setMusicUI(false); fadeTo(0, 400, () => bgm.pause()); };
if(bgm){
  musicBtn.addEventListener("click", () => wantMusic ? pauseMusic() : playMusic());
  document.addEventListener("visibilitychange", () => { if(document.hidden){ bgm.pause(); } else if(wantMusic){ bgm.play().catch(() => {}); } });
}

// Church scene: dove flies a 3D loop around the church, scene tilts with pointer, sparkles and feathers trail behind
const scene = $(".scene"), stage = $("#stage"), dove = $("#dove"), fx = $("#sceneFx"), hero = $(".hero");
let sceneOn = false, heroVisible = true;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function startScene(){
  if(sceneOn || reduceMotion) return; sceneOn = true;
  const w = scene.offsetWidth, h = scene.offsetHeight, A = w * 0.42, Z = w * 0.5, N = 72, kf = [];
  const sm = x => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }, wd = 0.5;
  for(let i = 0; i <= N; i++){
    const u = i / N, p = wd + u * Math.PI * 2;
    const x = -A * Math.cos(p), z = Z * Math.sin(p);
    const y = h * (0.12 * Math.sin(p) + 0.02 * Math.sin(p * 3)) - h * 0.04;
    const ry = 180 * sm((p - (Math.PI - wd)) / (2 * wd)) + 180 * sm((p - (Math.PI * 2 - wd)) / (2 * wd));
    const bank = Math.cos(p) * -7;
    kf.push({ offset: u, transform: `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,${z.toFixed(1)}px) rotateY(${ry.toFixed(1)}deg) rotateZ(${bank.toFixed(1)}deg)` });
  }
  dove.animate(kf, { duration: 17000, iterations: Infinity, easing: "linear" });
  new IntersectionObserver(([e]) => { heroVisible = e.isIntersecting; }).observe(hero);
  // pointer / tilt parallax
  let tx = 0, ty = 0, cx = 0, cy = 0;
  hero.addEventListener("pointermove", e => { const r = hero.getBoundingClientRect(); tx = (e.clientX - r.left) / r.width - 0.5; ty = (e.clientY - r.top) / r.height - 0.5; });
  hero.addEventListener("pointerleave", () => { tx = ty = 0; });
  addEventListener("deviceorientation", e => { if(e.gamma == null) return; tx = Math.max(-0.5, Math.min(0.5, e.gamma / 60)); ty = Math.max(-0.5, Math.min(0.5, ((e.beta || 60) - 60) / 90)); });
  (function tick(){ if(heroVisible){ cx += (tx - cx) * 0.06; cy += (ty - cy) * 0.06; stage.style.setProperty("--ry", (cx * 24).toFixed(2) + "deg"); stage.style.setProperty("--rx", (-cy * 16).toFixed(2) + "deg"); } requestAnimationFrame(tick); })();
  // trail
  let n = 0;
  setInterval(() => {
    if(!heroVisible || document.hidden) return;
    const r = dove.getBoundingClientRect(), s = scene.getBoundingClientRect(); if(!r.width) return;
    const el = document.createElement("span"), feather = (++n % 7 === 0);
    el.className = feather ? "fe" : "sp";
    el.style.left = (r.left + r.width * 0.5 - s.left) + "px"; el.style.top = (r.top + r.height * 0.6 - s.top) + "px";
    el.style.setProperty("--dx", (Math.random() * 30 - 15) + "px"); el.style.setProperty("--dy", (Math.random() * 20 - 4) + "px");
    fx.appendChild(el); setTimeout(() => el.remove(), feather ? 3300 : 1400);
  }, 150);
}

const cover = $("#cover"), open = () => {
  if(cover.classList.contains("open")) return;
  toTop(); burst(); cover.classList.add("open"); $("#app").classList.add("go"); setTimeout(startScene, 500);
  if(bgm){ musicBtn.hidden = false; setMusicUI(false); playMusic(); }
  setTimeout(() => { cover.style.display = "none"; }, 3000);
};
cover.addEventListener("click", open);
cover.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" ") open(); });

// RSVP
$("#rsvpForm").addEventListener("submit", e => {
  e.preventDefault(); const f = new FormData(e.target);
  const g = C.googleForm || {};
  let url = "", data = null;
  if(g.action && g.name && g.attend && g.guests){          // 1) Google Form
    url = g.action; data = new URLSearchParams();
    data.append(g.name, f.get("name")); data.append(g.attend, f.get("attend")); data.append(g.guests, f.get("guests"));
    if(g.note) data.append(g.note, f.get("note") || "");
  } else if(C.rsvpEndpoint){                                // 2) other web app
    url = C.rsvpEndpoint; data = new URLSearchParams(f);
  }
  if(url){
    const t = $("#thanks"), btn = e.target.querySelector("button"); btn.disabled = true;
    fetch(url, {method:"POST", mode:"no-cors", body:data})
      .then(()=>{ t.textContent = "Thank you! Your reply has been received."; t.style.display = "block"; e.target.reset(); btn.disabled = false; })
      .catch(()=>{ t.textContent = "Sorry, something went wrong. Please try again."; t.style.display = "block"; btn.disabled = false; });
    return;
  }
  // 3) Fallback: open an email
  const body = ["Name: "+f.get("name"),"Response: "+f.get("attend"),"Guests: "+f.get("guests"),"Note: "+(f.get("note")||"None")].join("\n");
  $("#thanks").style.display = "block";
  location.href = "mailto:"+C.rsvpEmail+"?subject="+encodeURIComponent("RSVP – "+f.get("name"))+"&body="+encodeURIComponent(body);
});
</script>
