<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1a3a">
<meta name="format-detection" content="telephone=no">
<title>Amara &amp; Julian – Wedding Invitation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500&display=swap">
<style>
/* ============================================================
   STYLE.CSS  (layout and look)
   Sections in order:
   1. Base and colors    2. Cover doors    3. Hero    4. Photo
   5. Invitation cards   6. Gallery        7. Form    8. Motion
   9. Mobile tweaks     10. Tablet / desktop (media queries)
   Colors themselves are set in script.js (CONFIG > themes).
   ============================================================ */
/* ============================================================
   COLORS: these are filled in by the theme chosen in CONFIG
   (bottom of file). Edit the palettes there, not here.
   ============================================================ */
:root{--cover:#0b1a3a;--cover2:#1d3568;--frame:#12275a;--paper:#eff1f6;--ink:#0b1a3a;--gold:#d8b45e;--light:#fff7ef;
--display:'Marcellus',Georgia,serif;--body:'Jost','Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#222;font-family:var(--body);font-weight:300;line-height:1.65;color:var(--ink)}
#app{width:100%;max-width:none;margin:0 auto;background:var(--paper);min-height:100svh;position:relative;overflow:hidden}
h1,h2{font-family:var(--display);font-weight:400;margin:0}
.pattern{background-image:linear-gradient(45deg,rgba(255,255,255,.14) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.14) 75%),linear-gradient(45deg,rgba(255,255,255,.14) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.14) 75%);background-size:28px 28px;background-position:0 0,14px 14px}
.lace{position:absolute;left:0;right:0;height:26px;background:radial-gradient(circle at 13px 0,transparent 11px,var(--light) 12px) 0 0/26px 26px repeat-x;opacity:.9}
.lace.top{top:0}.lace.bot{bottom:0;transform:scaleY(-1)}

/* COVER (doors) */
#cover{position:fixed;inset:0;z-index:50;display:flex;cursor:pointer}
#cover .door{flex:1;background-color:var(--cover);background-image:radial-gradient(ellipse at 50% 30%,var(--cover2),var(--cover) 70%);background-size:200% 100%;background-repeat:no-repeat;transition:transform 1.1s cubic-bezier(.7,0,.2,1);position:relative;overflow:hidden}
#cover .door.l{background-position:0 0}#cover .door.r{background-position:100% 0}
#cover .l{border-right:1px solid rgba(0,0,0,.25)}
#cover.open .l{transform:translateX(-101%)}#cover.open .r{transform:translateX(101%)}
#cover.open{pointer-events:none;transition:opacity 0s 1.2s;opacity:0}
#seal{position:absolute;left:50%;top:50%;width:150px;transform:translate(-50%,-50%);z-index:2;text-align:center;color:var(--light);transition:opacity .4s}
#cover.open #seal{opacity:0}
#seal svg{width:150px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
#seal p{margin:10px 0 0;font-size:.85rem;letter-spacing:.08em}

/* HERO */
.hero{min-height:100svh;background:radial-gradient(ellipse at 50% 30%,var(--cover2),var(--cover) 70%);color:var(--light);text-align:center;padding:90px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.hero .arch{position:absolute;inset:26px 26px auto;height:62%;border:2px solid rgba(255,247,239,.5);border-radius:200px 200px 0 0}
.hero svg.chand{width:110px;margin-bottom:10px;position:relative}
.hero small{letter-spacing:.06em;position:relative}
.names{font-size:clamp(2.6rem,13vw,3.8rem);line-height:1.05;margin:16px 0;position:relative}
.names i{display:block;font-family:var(--body);font-style:normal;font-size:.35em;color:var(--gold);margin:6px 0}
.hero .when{font-size:1.15rem;font-weight:400;position:relative}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:.7;animation:tw 3s infinite}
@keyframes tw{50%{opacity:.1;transform:scale(.5)}}

/* PHOTO */
.photo{min-height:100svh;position:relative;display:flex;align-items:flex-end;justify-content:center;padding:32px;background:linear-gradient(160deg,var(--cover2),var(--cover));background-size:cover;background-position:center}
.photo .hint{position:absolute;top:40%;left:0;right:0;text-align:center;color:var(--light);opacity:.75;font-size:.9rem;padding:0 40px}
.btn{font:inherit;font-weight:500;background:var(--gold);color:#2a1a05;border:0;border-radius:40px;padding:13px 28px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.fab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* INVITATION FRAME */
.frame{background-color:var(--frame);padding:18px}
.page{background:var(--paper);border-radius:34px 34px 18px 18px;padding:44px 26px;margin-bottom:18px;text-align:center;position:relative}
.page:last-child{margin-bottom:0}
.page h2{font-size:1.9rem;margin-bottom:12px;color:var(--frame)}
.page p{margin:8px 0}
.rule{width:60px;height:2px;background:var(--gold);margin:14px auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:300px;margin:16px auto;font-size:.9rem}
.cal b{font-weight:500;color:var(--frame)}
.cal .on{background:var(--frame);color:var(--light);border-radius:50%;font-weight:500}
.plan{list-style:none;padding:0;margin:14px 0 0;text-align:left}
.plan li{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid rgba(0,0,0,.12)}
.plan li:last-child{border:0}.plan time{flex:0 0 78px;color:var(--frame);font-weight:500}
.qr{width:170px;height:170px;margin:14px auto;border:2px dashed var(--gold);display:grid;place-items:center;font-size:.8rem;padding:10px;background-size:cover;background-position:center;background-color:#fff}
/* GALLERY ("Our moments")
   Photos keep their own shape and flow in rows that stretch to fill the card.
   Each photo's width follows its shape (--ar, set by script.js), and the target
   row height scales with the width of the card (--row-h), so sizes adapt to
   wherever the gallery sits: phone, tablet or desktop. */
.gal{container-type:inline-size;width:100%}
.grid{--row-h:clamp(100px,36cqw,190px);--gallery-gap:8px;
  display:flex;flex-wrap:wrap;justify-content:center;gap:var(--gallery-gap);margin-top:14px;width:100%}
.shot{--ar:1;margin:0;min-width:0;border-radius:8px;overflow:hidden;background:var(--frame);
  flex-grow:var(--ar);flex-shrink:1;flex-basis:calc(var(--ar) * var(--row-h));
  max-width:calc(var(--ar) * var(--row-h) * 1.5)}
.shot img{display:block;width:100%;height:auto;aspect-ratio:var(--ar);object-fit:cover}
.shot.ph{display:grid;place-items:center;color:var(--light);font-size:.75rem;aspect-ratio:var(--ar)}
form{display:grid;gap:14px;text-align:left;margin-top:16px}
label{display:grid;gap:5px;font-weight:400;font-size:.92rem}
input,select,textarea{font:inherit;font-weight:300;color:var(--ink);background:#fff;border:1px solid rgba(0,0,0,.25);border-radius:6px;padding:11px;width:100%}
fieldset{border:0;margin:0;padding:0;display:grid;gap:6px}legend{font-weight:400;font-size:.92rem;margin-bottom:4px;padding:0}
.ch{display:flex;gap:10px;align-items:center;font-weight:300}.ch input{width:auto}
#thanks{display:none;margin-top:16px;padding:14px;border:1px solid var(--gold);border-radius:8px}
.fab{position:fixed;right:max(12px,calc(50% - 228px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;background:var(--gold);color:#2a1a05;border:0;font:500 .7rem var(--body);cursor:pointer;z-index:40;box-shadow:0 3px 8px rgba(0,0,0,.35);text-decoration:none;display:grid;place-items:center}
@media (prefers-reduced-motion:reduce){#cover .door{transition:none}.spark{animation:none}html{scroll-behavior:auto}}

/* MOTION */
.hero{overflow:hidden}.photo{overflow:hidden}
.petals{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.petal{position:absolute;top:-24px;width:11px;height:15px;border-radius:80% 0 80% 0;background:var(--gold);opacity:.85;animation:fall linear infinite}
.petal.w{background:var(--light);opacity:.75}
@keyframes fall{0%{transform:translate3d(0,0,0) rotate(0)}100%{transform:translate3d(var(--dx),calc(100svh + 50px),0) rotate(600deg)}}
.hero svg.chand{transform-origin:50% 0;animation:sway 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
#seal svg{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.hero .rise{opacity:0;transform:translateY(22px)}
#app.go .rise{animation:rise 1.1s ease forwards;animation-delay:calc(var(--i)*.28s + .5s)}
@keyframes rise{to{opacity:1;transform:none}}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .9s ease,transform .9s ease}
.reveal.in{opacity:1;transform:none}
.rule{background:linear-gradient(90deg,transparent,var(--gold),#fff,var(--gold),transparent);background-size:200% 100%;animation:shine 3.5s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.names i{animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{text-shadow:0 0 14px var(--gold)}}
.fab{animation:bob 2.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.petal{display:none}.hero svg.chand,#seal svg,.rule,.names i,.fab{animation:none}.hero .rise,.reveal{opacity:1;transform:none;transition:none}#app.go .rise{animation:none}}

/* MOBILE FRIENDLY */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#cover,.btn,.fab,label.ch,button{touch-action:manipulation}
.petal{will-change:transform}
.hero .arch{inset:calc(22px + env(safe-area-inset-top,0px)) 20px 28px;height:auto;border-bottom:0}
.hero>small,.hero .when{max-width:34rem}
.qr{width:min(190px,60%);height:auto;aspect-ratio:1}
.photo{background-position:center 30%}
.plan{max-width:480px;margin-inline:auto}
img,svg{max-width:100%}
#cover{height:100vh;height:100dvh}
.hero,.photo{min-height:100vh;min-height:100svh}
.hero{padding:calc(70px + env(safe-area-inset-top,0px)) 24px calc(60px + env(safe-area-inset-bottom,0px))}
.photo{padding:32px 32px calc(40px + env(safe-area-inset-bottom,0px))}
.frame{padding:16px max(16px,calc((100% - 640px)/2)) calc(90px + env(safe-area-inset-bottom,0px))}
.btn{min-height:48px;display:inline-flex;align-items:center;justify-content:center;padding:12px 30px}
form .btn{width:100%}
input,select,textarea{font-size:16px;min-height:48px}
textarea{min-height:90px}
.ch{min-height:48px;padding:6px 12px;border:1px solid rgba(0,0,0,.2);border-radius:8px;background:#fff}
.ch input{width:22px;height:22px;min-height:0;flex:0 0 22px}
.fab{width:52px;height:52px;right:max(14px,env(safe-area-inset-right,0px))}
.page a.btn{margin-top:6px}
@media (max-width:480px){
  body{font-size:16px}
  .page{padding:38px 20px;border-radius:28px 28px 14px 14px}
  .page h2{font-size:1.7rem}
  .plan time{flex-basis:70px}
  .cal{gap:2px;font-size:.85rem}
  .cal span,.cal b{padding:5px 0}
}

/* RESPONSIVE: tablet, laptop and desktop */
@media (min-width:768px){
  body{font-size:17px}
  #seal,#seal svg{width:190px}
  .hero{padding-inline:48px}
  .hero .arch{left:50%;right:auto;width:min(640px,calc(100% - 48px));transform:translateX(-50%);border-radius:320px 320px 0 0}
  .hero svg.chand{width:150px}
  .names{font-size:clamp(3.8rem,7.5vw,7rem)}
  .hero .when{font-size:1.4rem}
  .hero>small{font-size:1.05rem}
  .photo{min-height:min(100svh,860px);padding:48px}
  .frame{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:stretch;padding:40px max(32px,calc((100% - 1040px)/2)) calc(100px + env(safe-area-inset-bottom,0px))}
  .frame .page{margin:0;padding:52px 36px;display:flex;flex-direction:column;align-items:center;border-radius:40px 40px 20px 20px}
  .frame .page:nth-child(1),.frame .page:nth-child(6),.frame .page:nth-child(7){grid-column:1/-1}
  .page h2{font-size:2.1rem}
  .cal{max-width:340px;width:100%}
  .plan{width:100%}
  #rsvp form{width:100%;max-width:560px}
  #rsvp form .btn{width:100%}
  .fab{right:max(24px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  .btn,.fab{transition:transform .2s ease,filter .2s ease}
  .btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
}
@media (min-width:1200px){
  body{font-size:18px}
  .names{font-size:clamp(5rem,7vw,8rem)}
  .hero svg.chand{width:170px}
  .page h2{font-size:2.4rem}
  .frame{gap:26px;padding-top:56px}
  .frame .page{padding:60px 48px}
}
@media (min-width:1600px){
  .frame{padding-inline:max(32px,calc((100% - 1200px)/2))}
}
@media (max-height:520px) and (orientation:landscape){
  .hero{padding-top:50px;padding-bottom:40px}
  .hero svg.chand{width:70px}
  .names{margin:8px 0}
  #seal{width:110px}#seal svg{width:110px}
}
</style>
</head>
<body>
<div id="cover" role="button" tabindex="0" aria-label="Open invitation">
  <div class="door l"><div class="petals"></div><span class="spark" style="top:28%;left:30%"></span><span class="spark" style="top:62%;left:70%;animation-delay:1.4s"></span><div class="lace top"></div><div class="lace bot"></div></div>
  <div class="door r"><div class="petals"></div><span class="spark" style="top:40%;left:60%;animation-delay:.7s"></span><span class="spark" style="top:70%;left:25%;animation-delay:2.1s"></span><div class="lace top"></div><div class="lace bot"></div></div>
  <div id="seal">
    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2"><path d="M50 4c8 16 18 26 34 30-16 4-26 14-34 30-8-16-18-26-34-30 16-4 26-14 34-30Z" fill="var(--light)" stroke="var(--gold)"/><path d="M50 22c5 10 11 16 20 18-9 2-15 8-20 18-5-10-11-16-20-18 9-2 15-8 20-18Z" fill="var(--cover)"/><circle cx="50" cy="40" r="5" fill="var(--gold)" stroke="none"/></svg>
    <p data-t="coverText"></p>
  </div>
</div>

<div id="app">
  <header class="hero" id="top">
    <div class="arch"></div>
    <div class="petals"></div>
    <span class="spark" style="top:30%;left:20%"></span><span class="spark" style="top:45%;left:78%;animation-delay:1s"></span><span class="spark" style="top:60%;left:30%;animation-delay:2s"></span><span class="spark" style="top:36%;left:60%;animation-delay:.5s"></span>
    <svg class="chand rise" style="--i:0" viewBox="0 0 100 90" fill="none" stroke="var(--light)" stroke-width="1.5"><path d="M50 0v14M30 24h40M22 34h56M14 44h72"/><path d="M50 14c-14 0-24 6-28 20M50 14c14 0 24 6 28 20M22 34c-6 6-8 12-8 18M78 34c6 6 8 12 8 18"/><g stroke="var(--gold)"><path d="M30 24v10M50 24v10M70 24v10M22 44v14M50 44v22M78 44v14"/></g></svg>
    <small class="rise" style="--i:1" data-t="intro"></small>
    <h1 class="names rise" style="--i:2"><span data-t="name1"></span><i>and</i><span data-t="name2"></span></h1>
    <small class="rise" style="--i:3" data-t="invite"></small>
    <p class="when rise" style="--i:4" data-t="dateLong"></p>
  </header>

  <section class="photo" id="photo">
    <div class="petals"></div>
    <p class="hint">Add your couple photo: set <b>photo</b> in CONFIG</p>
    <a class="btn" href="#details" data-t="openButton"></a>
  </section>

  <div class="frame pattern" id="details">
    <div class="page reveal">
      <h2 data-t="welcomeTitle"></h2><div class="rule"></div>
      <p data-t="welcomeText"></p>
      <p><b data-t="hostLine"></b></p>
    </div>
    <div class="page reveal">
      <h2 data-t="dateTitle"></h2><div class="rule"></div>
      <p data-t="dateLong"></p>
      <div class="cal" id="cal"></div>
      <p data-t="venue"></p><p style="opacity:.75" data-t="address"></p>
      <p><a class="btn" id="map" target="_blank" rel="noopener" data-t="mapButton"></a></p>
      <p style="opacity:.75" data-t="dress"></p>
    </div>
    <div class="page reveal">
      <h2 data-t="scheduleTitle"></h2><div class="rule"></div>
      <ul class="plan" id="plan"></ul>
    </div>
    <div class="page reveal">
      <h2 data-t="giftTitle"></h2><div class="rule"></div>
      <p data-t="giftText"></p>
      <div class="qr" id="qr"></div>
      <p style="opacity:.75" data-t="giftNote"></p>
    </div>
    <div class="page reveal gal">
      <h2 data-t="galleryTitle"></h2><div class="rule"></div>
      <div class="grid" id="gallery"></div>
    </div>
    <div class="page reveal" id="rsvp">
      <h2 data-t="rsvpTitle"></h2><div class="rule"></div>
      <p data-t="rsvpText"></p>
      <form id="rsvpForm">
        <label>Your full name<input name="name" required autocomplete="name"></label>
        <fieldset><legend>Will you attend?</legend>
          <label class="ch"><input type="radio" name="attend" value="Joyfully accepts" required> Joyfully accepts</label>
          <label class="ch"><input type="radio" name="attend" value="Regretfully declines"> Regretfully declines</label>
        </fieldset>
        <label>Number of guests, including you<select name="guests"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
        <label>A note for the couple<textarea name="note" rows="3" placeholder="Optional"></textarea></label>
        <button class="btn" type="submit">Send my RSVP</button>
      </form>
      <div id="thanks">Your email is ready to send. Thank you for replying!</div>
    </div>
    <div class="page reveal"><h2 data-t="closing"></h2></div>
  </div>
  <a class="fab" href="#rsvp" aria-label="Go to RSVP">RSVP</a>
</div>

<script>
/* ============================================================
   SCRIPT.JS  (your words, photos and settings live in CONFIG below)
   EDIT EVERYTHING HERE. Save the file, then refresh the browser.
   ============================================================ */
const CONFIG = {
  // ---- Names and words ----
  name1: "Jonel",
  name2: "Julleane",
  coverText: "Tap to open",
  intro: "Together with their families",
  invite: "invite you to celebrate their wedding",
  openButton: "Open invitation",
  welcomeTitle: "You are invited",
  welcomeText: "With joy in our hearts, we invite you to share the beginning of our life together. Your presence will make our day complete.",
  hostLine: "The families of Jonel and Julleane",

  // ---- Date, place, dress code ----
  dateISO: "2026-12-21",                 // YYYY-MM-DD, the calendar builds itself from this
  dateTitle: "Save the date",
  venue: "Sto Dominic of Guzman Parish",
  address: "Sto Domingo Nabua Camarines Sur",
  mapUrl: "https://maps.app.goo.gl/hQtddBzumzVWBfvk9",
  mapButton: "Open map",
  dress: "Dress code: garden formal",

  // ---- Schedule (add or remove lines) ----
  scheduleTitle: "Schedule",
  schedule: [
    ["3:00 PM", "Ceremony", "Please arrive by 2:30 PM"],
    ["4:00 PM", "Cocktails and photos", "On the terrace"],
    ["5:30 PM", "Dinner and dancing", "Garden Hall"]
  ],

  // ---- Gift, gallery, RSVP ----
  giftTitle: "Gifts",
  giftText: "Your love is the best gift. If you wish to give something, you may scan the code below.",
  giftNote: "Replace this box with your QR image (set qrImage).",
  qrImage: "",                           // e.g. "qr.png" (file next to this page)
  galleryTitle: "Our moments",
  gallery: ["", "", "", ""],             // any number of photos, e.g. ["p1.jpg","p2.jpg","p3.jpg","p4.jpg","p5.jpg"]
  photo: "",                             // couple photo, e.g. "couple.jpg"
  rsvpTitle: "RSVP",
  rsvpText: "Please reply by 1 October 2026",
  rsvpEndpoint: "",                      // paste your Google Sheet web app URL here (see setup steps)
  rsvpEmail: "rsvp@example.com",         // used only if rsvpEndpoint is empty
  closing: "With love, Jonel and Julleane",

  // ---- COLORS ----
  theme: "midnight",
  themes: {
    //          doors/hero   hero glow    page border  paper       text        accent
    midnight:{ cover:"#0b1a3a", cover2:"#1d3568", frame:"#12275a", paper:"#eff1f6", ink:"#0b1a3a", gold:"#d8b45e" }
  }
};

/* ---------- Do not need to edit below this line ---------- */
const C = CONFIG, $ = s => document.querySelector(s);
const d = new Date(C.dateISO + "T00:00:00");
C.dateLong = d.toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"});

function applyTheme(n){
  const t = C.themes[n]; if(!t) return;
  for(const k in t) document.documentElement.style.setProperty("--"+k, t[k]);
  document.querySelectorAll(".pattern").forEach(e=>{ if(e.closest("#cover")) e.style.backgroundColor = t.cover; else e.style.backgroundColor = t.frame; });
}
document.querySelectorAll("[data-t]").forEach(e => e.textContent = C[e.dataset.t]);
document.title = C.name1 + " & " + C.name2 + " – Wedding Invitation";
$("#map").href = C.mapUrl;
$("#plan").innerHTML = C.schedule.map(s => `<li><time>${s[0]}</time><span><b style="font-weight:500">${s[1]}</b><br><span style="opacity:.75">${s[2]||""}</span></span></li>`).join("");

// Calendar
const cal = $("#cal"); let h = ["S","M","T","W","T","F","S"].map(x=>`<b>${x}</b>`).join("");
const first = new Date(d.getFullYear(), d.getMonth(), 1).getDay(), days = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
h += "<span></span>".repeat(first);
for(let i=1;i<=days;i++) h += `<span class="${i===d.getDate()?"on":""}">${i}</span>`;
cal.innerHTML = h;

// Images (blank keeps the colored placeholder)
if(C.photo) $("#photo").style.backgroundImage = `linear-gradient(transparent 60%,rgba(0,0,0,.5)),url("${C.photo}")`, $(".hint").hidden = true;
if(C.qrImage) $("#qr").style.backgroundImage = `url("${C.qrImage}")`; else $("#qr").textContent = "QR code";
const PH_AR = [0.75, 1, 1.33];   // placeholder shapes until real photos are set
$("#gallery").innerHTML = C.gallery.map((g,i)=> g
  ? `<figure class="shot"><img src="${g}" alt="Photo ${i+1}" decoding="async"></figure>`
  : `<figure class="shot ph" style="--ar:${PH_AR[i%3]}">Photo ${i+1}</figure>`).join("");
// Size each photo by its own shape so rows fill the card neatly
document.querySelectorAll("#gallery .shot img").forEach(img=>{
  const fit = () => { if(img.naturalWidth) img.parentNode.style.setProperty("--ar", (img.naturalWidth/img.naturalHeight).toFixed(4)); };
  img.complete ? fit() : img.addEventListener("load", fit);
});
if(C.qrImage) $("[data-t=giftNote]").textContent = "";

// Theme
applyTheme(C.theme);
// Petals
document.querySelectorAll(".petals").forEach(box=>{
  const inCover=!!box.closest("#cover"), total=innerWidth<500?10:innerWidth<1000?16:26;
  for(let i=0;i<(inCover?Math.ceil(total*0.7):total);i++){
    const p=document.createElement("span");
    p.className="petal"+(i%2?" w":"");
    p.style.left=(Math.random()*100)+"%";
    p.style.setProperty("--dx",(Math.random()*120-60)+"px");
    p.style.animationDuration=(9+Math.random()*8)+"s";
    p.style.animationDelay=(-Math.random()*14)+"s";
    p.style.transform="scale("+(0.7+Math.random()*0.8)+")";
    box.appendChild(p);
  }
});
// Scroll reveal
const io=("IntersectionObserver" in window)?new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.15}):null;
document.querySelectorAll(".reveal").forEach(e=>io?io.observe(e):e.classList.add("in"));

// Cover
const cover = $("#cover"), open = () => { cover.classList.add("open"); $("#app").classList.add("go"); };
cover.addEventListener("click", open);
cover.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" ") open(); });

// RSVP
$("#rsvpForm").addEventListener("submit", e => {
  e.preventDefault(); const f = new FormData(e.target);
  if(C.rsvpEndpoint){
    const t = $("#thanks"), btn = e.target.querySelector("button"); btn.disabled = true;
    fetch(C.rsvpEndpoint, {method:"POST", mode:"no-cors", body:new URLSearchParams(f)})
      .then(()=>{ t.textContent = "Thank you! Your reply has been received."; t.style.display = "block"; e.target.reset(); btn.disabled = false; })
      .catch(()=>{ t.textContent = "Sorry, something went wrong. Please try again."; t.style.display = "block"; btn.disabled = false; });
    return;
  }
  const body = ["Name: "+f.get("name"),"Response: "+f.get("attend"),"Guests: "+f.get("guests"),"Meal or dietary needs: "+(f.get("diet")||"None"),"Note: "+(f.get("note")||"None")].join("\n");
  $("#thanks").style.display = "block";
  location.href = "mailto:"+C.rsvpEmail+"?subject="+encodeURIComponent("RSVP – "+f.get("name"))+"&body="+encodeURIComponent(body);
});
</script>
</body>
</html>
